services:
  # ---- PostgreSQL (Port 5433 — 5432 used by chatwoot) ----
  postgres:
    image: postgres:16-alpine
    container_name: md-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: master_dashboard
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - md_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d master_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- API Gateway (Port 4000) ----
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: md-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://dashboard_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/master_dashboard
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Dashboard (Port 3100 — 3000 used by open-webui) ----
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: md-dashboard
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api

  # ---- Nginx Reverse Proxy (Port 8090 — 80 may be in use) ----
  nginx:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: md-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - api

volumes:
  md_pg_data:
